name: Запуск Telegram Groq Бота

on:
  workflow_dispatch: # Позволяет запустить вручную
  schedule:
    # Запуск каждые 30 минут (в GitHub Actions минимальный интервал - 5 минут, но 30 надежнее)
    - cron: '*/30 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Максимум 60 минут на один запуск (лимит GitHub)

    steps:
      - name: Скачать код из репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запустить бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py
